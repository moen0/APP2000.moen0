<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leksjon 3 - Oppgave 2: Funksjoner som genererer HTML</title>
    <link rel="stylesheet" href="../leksjon02/stil.css">
</head>
<body>
<main class="side">
    <header>
        <p class="brodsmuler"><a href="../index.html">UT.ut</a> / Leksjon 3 / Oppgave 2</p>
        <h1>Funksjoner som genererer HTML</h1>
        <p class="ingress">
            Tre små funksjoner som produserer HTML-elementer og legger dem i dokumentet:
            <code>lagH1</code>, <code>lagOverskrift</code> og <code>lagPunktliste</code>.
            Alle bruker <code>document.createElement</code> og <code>textContent</code>
            for å unngå XSS.
        </p>
    </header>

    <section>
        <h2>Resultat</h2>
        <div id="utskrift"></div>
    </section>

    <section>
        <h2>Interaktiv test</h2>
        <form id="testskjema" class="skjema" novalidate>
            <label>
                Overskriftstekst
                <input name="tekst" type="text" value="Velkommen til UT.ut">
            </label>
            <label>
                Niva (1, 2 eller 3)
                <input name="niva" type="number" min="1" max="3" value="2">
            </label>
            <label>
                Punkter (komma-separert)
                <input name="punkter" type="text" value="Preikestolen, Besseggen, Kjerag">
            </label>
            <div class="knapper">
                <button type="submit" class="primaer">Generer</button>
            </div>
        </form>
        <div id="test-utskrift" style="margin-top: 16px;"></div>
    </section>
</main>

<script src="oppgave2-funksjoner.js" defer></script>
</body>
</html>
